name: Deploy EduBot

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: |
          pip install boto3 moto
          python -m pytest tests/ -v

      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: SAM Build
        run: sam build

      - name: SAM Deploy
        run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          REACT_APP_AWS_REGION: us-east-1
          REACT_APP_IDENTITY_POOL_ID: ${{ secrets.IDENTITY_POOL_ID }}
          REACT_APP_LEX_BOT_ID: ${{ secrets.LEX_BOT_ID }}
          REACT_APP_LEX_BOT_ALIAS_ID: ${{ secrets.LEX_BOT_ALIAS_ID }}

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/build/ s3://edubot-frontend-${{ secrets.AWS_ACCOUNT_ID }}/ --delete
