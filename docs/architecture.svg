<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a56db"/>
      <stop offset="100%" style="stop-color:#1e3a8a"/>
    </linearGradient>
    <linearGradient id="lambdaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9900"/>
      <stop offset="100%" style="stop-color:#E88600"/>
    </linearGradient>
    <linearGradient id="lexGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#527FFF"/>
      <stop offset="100%" style="stop-color:#3B5FCC"/>
    </linearGradient>
    <linearGradient id="dynamoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4053D6"/>
      <stop offset="100%" style="stop-color:#2E3BB0"/>
    </linearGradient>
    <linearGradient id="s3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3F8624"/>
      <stop offset="100%" style="stop-color:#2D6B18"/>
    </linearGradient>
    <linearGradient id="cognitoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#DD344C"/>
      <stop offset="100%" style="stop-color:#B82A3E"/>
    </linearGradient>
    <linearGradient id="cwGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E7157B"/>
      <stop offset="100%" style="stop-color:#C01268"/>
    </linearGradient>
    <linearGradient id="cicdGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#24292E"/>
      <stop offset="100%" style="stop-color:#1B1F23"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" rx="12" fill="#f8fafc"/>

  <!-- Title -->
  <rect x="0" y="0" width="900" height="56" rx="12" fill="url(#headerGrad)"/>
  <rect x="0" y="30" width="900" height="26" fill="url(#headerGrad)"/>
  <text x="450" y="36" text-anchor="middle" fill="white" font-size="22" font-weight="bold">EduBot — Architecture Diagram</text>

  <!-- CI/CD Box -->
  <rect x="250" y="75" width="400" height="50" rx="8" fill="url(#cicdGrad)" filter="url(#shadow)"/>
  <text x="450" y="98" text-anchor="middle" fill="white" font-size="13" font-weight="600">GitHub Actions CI/CD</text>
  <text x="450" y="114" text-anchor="middle" fill="#aaa" font-size="10">SAM build → test → deploy on push</text>

  <!-- Arrow from CI/CD down -->
  <line x1="450" y1="125" x2="450" y2="148" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <defs><marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#666"/></marker></defs>

  <!-- User Icon -->
  <rect x="30" y="250" width="120" height="70" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="90" y="280" text-anchor="middle" fill="#334155" font-size="24">👤</text>
  <text x="90" y="302" text-anchor="middle" fill="#475569" font-size="11" font-weight="600">Student User</text>

  <!-- S3 + CloudFront -->
  <rect x="210" y="155" width="180" height="65" rx="8" fill="url(#s3Grad)" filter="url(#shadow)"/>
  <text x="300" y="182" text-anchor="middle" fill="white" font-size="13" font-weight="600">S3 + CloudFront</text>
  <text x="300" y="200" text-anchor="middle" fill="#d4edda" font-size="10">React Static Site</text>

  <!-- Cognito -->
  <rect x="510" y="155" width="180" height="65" rx="8" fill="url(#cognitoGrad)" filter="url(#shadow)"/>
  <text x="600" y="182" text-anchor="middle" fill="white" font-size="13" font-weight="600">Amazon Cognito</text>
  <text x="600" y="200" text-anchor="middle" fill="#fdd" font-size="10">Identity Pool (Unauth)</text>

  <!-- Arrow: User to S3 -->
  <line x1="150" y1="280" x2="210" y2="195" stroke="#3F8624" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="165" y="230" fill="#475569" font-size="9" transform="rotate(-25, 165, 230)">HTTPS</text>

  <!-- Arrow: S3 to Cognito -->
  <line x1="390" y1="187" x2="510" y2="187" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="450" y="180" text-anchor="middle" fill="#475569" font-size="9">auth</text>

  <!-- Lex -->
  <rect x="310" y="270" width="280" height="65" rx="8" fill="url(#lexGrad)" filter="url(#shadow)"/>
  <text x="450" y="297" text-anchor="middle" fill="white" font-size="14" font-weight="600">Amazon Lex v2</text>
  <text x="450" y="318" text-anchor="middle" fill="#cce" font-size="10">NLP — Intent Detection &amp; Slot Extraction</text>

  <!-- Arrow: S3 to Lex -->
  <line x1="300" y1="220" x2="400" y2="270" stroke="#527FFF" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="330" y="248" fill="#475569" font-size="9">chat messages</text>

  <!-- Arrow: Cognito to Lex -->
  <line x1="600" y1="220" x2="500" y2="270" stroke="#DD344C" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="565" y="248" fill="#475569" font-size="9">credentials</text>

  <!-- Lambda -->
  <rect x="310" y="385" width="280" height="65" rx="8" fill="url(#lambdaGrad)" filter="url(#shadow)"/>
  <text x="450" y="412" text-anchor="middle" fill="white" font-size="14" font-weight="600">AWS Lambda</text>
  <text x="450" y="433" text-anchor="middle" fill="#fff8e0" font-size="10">Python 3.11 — Business Logic</text>

  <!-- Arrow: Lex to Lambda -->
  <line x1="450" y1="335" x2="450" y2="385" stroke="#FF9900" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="465" y="363" fill="#475569" font-size="9">invokes</text>

  <!-- DynamoDB -->
  <rect x="310" y="500" width="280" height="65" rx="8" fill="url(#dynamoGrad)" filter="url(#shadow)"/>
  <text x="450" y="527" text-anchor="middle" fill="white" font-size="14" font-weight="600">Amazon DynamoDB</text>
  <text x="450" y="548" text-anchor="middle" fill="#cce" font-size="10">EduBot-Courses (Key-Value)</text>

  <!-- Arrow: Lambda to DynamoDB -->
  <line x1="450" y1="450" x2="450" y2="500" stroke="#4053D6" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="465" y="478" fill="#475569" font-size="9">queries</text>

  <!-- CloudWatch + X-Ray -->
  <rect x="700" y="385" width="170" height="65" rx="8" fill="url(#cwGrad)" filter="url(#shadow)"/>
  <text x="785" y="410" text-anchor="middle" fill="white" font-size="12" font-weight="600">CloudWatch</text>
  <text x="785" y="428" text-anchor="middle" fill="#fde" font-size="10">Dashboards + Alarms</text>
  <text x="785" y="442" text-anchor="middle" fill="#fde" font-size="10">+ X-Ray Tracing</text>

  <!-- Arrow: Lambda to CloudWatch -->
  <line x1="590" y1="417" x2="700" y2="417" stroke="#E7157B" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="645" y="410" text-anchor="middle" fill="#475569" font-size="9">logs/traces</text>

  <!-- Legend -->
  <rect x="30" y="510" width="230" height="95" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="45" y="532" fill="#334155" font-size="12" font-weight="600">AWS Services (7)</text>
  <circle cx="50" cy="548" r="5" fill="#3F8624"/><text x="62" y="552" fill="#475569" font-size="9">S3 + CloudFront</text>
  <circle cx="150" cy="548" r="5" fill="#DD344C"/><text x="162" y="552" fill="#475569" font-size="9">Cognito</text>
  <circle cx="50" cy="566" r="5" fill="#527FFF"/><text x="62" y="570" fill="#475569" font-size="9">Lex v2</text>
  <circle cx="150" cy="566" r="5" fill="#FF9900"/><text x="162" y="570" fill="#475569" font-size="9">Lambda</text>
  <circle cx="50" cy="584" r="5" fill="#4053D6"/><text x="62" y="588" fill="#475569" font-size="9">DynamoDB</text>
  <circle cx="150" cy="584" r="5" fill="#E7157B"/><text x="162" y="588" fill="#475569" font-size="9">CloudWatch + X-Ray</text>
</svg>
